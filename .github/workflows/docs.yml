name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'doc/site/**'
      - 'framework/doc/site/**'
      - 'framework/doc/framework/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r doc/site/requirements.txt -r framework/doc/site/requirements.txt

      # 두 사이트의 게이트를 따로 돌린다. 한쪽 회귀가 다른 쪽 검증을 가리지 않는다.
      # 언어별 장은 공통 소스에서 생성한다. 소스만 고치고 생성물을 안 올리면
      # 사이트가 옛 내용을 낸다.
      - name: Check generated language guides are up to date
        run: python3 doc/site/scripts/generate_language_guides.py --check

      - name: Check framework language tabs and snippets
        run: python3 doc/site/scripts/check_doc_tabs.py framework

      - name: Check guide example identifiers
        run: python3 doc/site/scripts/check_guide_identifiers.py

      - name: Check common guide prose neutrality
        run: python3 doc/site/scripts/check_prose_neutrality.py

      # 상대 링크와 anchor. mkdocs는 docs_dir 안만 보므로 별도로 돌린다.
      # repo-doc·bindings-doc은 v11이 지운 서비스 계층 장을 아직 가리켜 제외한다
      # (framework/doc/plan/v11.0/guide-authoring-implementation-gaps.ko.md B2).
      - name: Check document links and anchors
        run: python3 doc/site/scripts/check_doc_links.py framework framework-plan core-doc

      - name: Check framework document contracts
        run: bash scripts/verify-framework-doc-contracts.sh

      # framework 사이트는 아직 배포 대상이 아니다. 도메인 분리 방식이 정해질 때까지
      # 빌드만 돌려 정본 트리가 깨지지 않는지 확인한다.
      # 배포 안은 framework/doc/plan/language-guide-port-runbook.ko.md §7.3이 소유한다.
      - name: Build framework documentation
        working-directory: framework/doc/site
        run: mkdocs build

      - name: Check core language tabs and snippets
        run: python3 doc/site/scripts/check_doc_tabs.py core

      - name: Build core documentation
        working-directory: doc/site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
