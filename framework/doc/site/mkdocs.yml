site_name: ZLink Framework
site_url: https://zlink.systems/
site_description: ZLink Framework — 실시간 메시징 서버 프레임워크

repo_url: https://github.com/zlink-systems/zlink
repo_name: zlink-systems/zlink

# 정본 문서 트리를 그대로 docs root로 쓴다. 사이트용 사본을 두지 않으므로
# 문서끼리의 상대 링크가 repo에서든 사이트에서든 같은 대상을 가리킨다.
docs_dir: ../framework

theme:
  name: material
  language: ko
  # Material 기본 Roboto에는 한글 글리프가 없다. 한글이 글자마다 OS 대체 폰트로
  # 떨어지면서 자간과 굵기가 흔들리므로 시스템 한글 폰트를 쓴다.
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.highlight

extra_css:
  - assets/korean.css

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ko
          name: 한국어
          default: true
          build: true

# 가이드 · 스펙 · 샘플만 사이트에 올린다(런북 §7.1). internals는 구현·검증 기준이고
# e2e는 검증 시나리오라 독자용 문서가 아니다. mkdocs는 nav에 없어도 docs_dir 아래
# 파일을 전부 빌드하므로 여기서 명시적으로 뺀다.
exclude_docs: |
  perf/
  */internals/
  common/e2e/
  # 공통 가이드는 언어 탭을 담은 **소스**다. 읽는 자리는 언어별 생성판이므로
  # 사이트에 싣지 않는다(doc/site/scripts/generate_language_guides.py).
  common/guide/

