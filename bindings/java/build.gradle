plugins {
    id 'java'
    id 'maven-publish'
}

group = 'dev.kairoscode'
version = '5.0.30'
description = 'zlink Java bindings — high-performance async messaging library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

def nativeOs = System.getProperty('os.name').toLowerCase()
def nativeArch = System.getProperty('os.arch').toLowerCase()
def nativeBridgeSupported = nativeOs.contains('linux')
    && ['amd64', 'x86_64'].contains(nativeArch)
def generatedNativeResourcesDir = layout.buildDirectory.dir(
    'generated/zlink-native-resources/main')
def bridgeOutputDir = layout.buildDirectory.dir(
    'generated/zlink-native-resources/main/native/linux-x86_64')

sourceSets {
    main {
        resources.srcDir(generatedNativeResourcesDir)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'io.netty:netty-buffer:4.1.100.Final'
    runtimeOnly 'io.netty:netty-buffer:4.1.100.Final'
    testImplementation 'io.netty:netty-buffer:4.1.100.Final'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.register('buildZlinkJavaBridge', Exec) {
    onlyIf { nativeBridgeSupported }
    def repoRoot = projectDir.parentFile.parentFile
    def source = new File(projectDir, 'native/src/zlink_java_reqrep_bridge.c')
    def outputDir = bridgeOutputDir.get().asFile
    def output = new File(outputDir, 'libzlink_java_bridge.so')
    def linkDir = new File(projectDir, 'src/main/resources/native/linux-x86_64')
    inputs.file(source)
    inputs.dir(new File(repoRoot, 'core/include'))
    inputs.dir(linkDir)
    outputs.file(output)
    doFirst {
        outputDir.mkdirs()
    }
    commandLine 'cc',
        '-shared',
        '-fPIC',
        '-std=c11',
        '-O2',
        '-pthread',
        '-I', new File(repoRoot, 'core/include').absolutePath,
        '-L', linkDir.absolutePath,
        '-Wl,-rpath,$ORIGIN',
        '-Wl,--no-as-needed',
        '-o', output.absolutePath,
        source.absolutePath,
        '-lzlink'
}

processResources.dependsOn tasks.named('buildZlinkJavaBridge')

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    def reqrepDebug = System.getProperty('zlink.reqrep.debug')
    if (reqrepDebug != null) {
        systemProperty 'zlink.reqrep.debug', reqrepDebug
    }
    filter {
        excludeTestsMatching 'dev.kairoscode.zlink.integration.*'
    }
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    def reqrepDebug = System.getProperty('zlink.reqrep.debug')
    if (reqrepDebug != null) {
        systemProperty 'zlink.reqrep.debug', reqrepDebug
    }
    shouldRunAfter test
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'dev.kairoscode.zlink.integration.contract.*'
    }
}

javadoc {
    options.encoding = 'UTF-8'
    options.docTitle = 'zlink Java Binding API'
    options.windowTitle = 'zlink Java Binding'
    options.memberLevel = JavadocMemberLevel.PUBLIC
    exclude 'dev/kairoscode/zlink/internal/**'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'zlink'
            version = project.version
        }
    }
    repositories {
        maven {
            name = 'releaseRepo'
            def repoUrl = System.getenv('MAVEN_REPOSITORY_URL')
            if (repoUrl == null || repoUrl.trim().isEmpty()) {
                def ghRepo = System.getenv('GITHUB_REPOSITORY')  // owner/repo
                if (ghRepo != null && !ghRepo.trim().isEmpty()) {
                    repoUrl = "https://maven.pkg.github.com/${ghRepo}"
                } else {
                    repoUrl = "${buildDir}/repo"
                }
            }
            url = uri(repoUrl)
            credentials {
                def u = System.getenv('MAVEN_REPOSITORY_USERNAME')
                def p = System.getenv('MAVEN_REPOSITORY_PASSWORD')
                if ((u == null || u.trim().isEmpty()) && (p == null || p.trim().isEmpty())) {
                    u = System.getenv('GITHUB_ACTOR')
                    p = System.getenv('GITHUB_TOKEN')
                }
                username = u
                password = p
            }
        }
    }
}
