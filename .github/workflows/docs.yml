name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'doc/site/**'
      - 'framework/doc/framework/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r doc/site/requirements.txt

      # 두 사이트의 게이트를 따로 돌린다. 한쪽 회귀가 다른 쪽 검증을 가리지 않는다.
      # 언어별 장은 공통 소스에서 생성한다. 소스만 고치고 생성물을 안 올리면
      # 사이트가 옛 내용을 낸다.
      - name: Check generated language guides are up to date
        run: python3 doc/site/scripts/generate_language_guides.py --check

      - name: Check framework language tabs and snippets
        run: python3 doc/site/scripts/check_doc_tabs.py framework

      - name: Check guide example identifiers
        run: python3 doc/site/scripts/check_guide_identifiers.py

      - name: Check common guide prose neutrality
        run: python3 doc/site/scripts/check_prose_neutrality.py

      # 상대 링크와 anchor. mkdocs는 docs_dir 안만 보므로 별도로 돌린다.
      # repo-doc·bindings-doc은 v11이 지운 서비스 계층 장을 아직 가리켜 제외한다
      # (framework/doc/plan/v11.0/guide-authoring-implementation-gaps.ko.md B2).
      - name: Check document links and anchors
        run: python3 doc/site/scripts/check_doc_links.py framework framework-plan core-doc

      # 가이드가 인용하는 교육용 예제는 실제 컴파일 대상이다. 계약과 어긋난 코드가
      # 문서에 실리는 것을 컴파일러가 막는다.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Compile guide examples (Java)
        working-directory: framework/languages/java
        run: ./gradlew :zlink-framework-doc-examples:compileJava

      - name: Check framework document contracts
        run: bash scripts/verify-framework-doc-contracts.sh

      # 사이트는 하나다. `doc/site/docs/`가 정본 트리를 심링크로 모아 두었고
      # (framework · core · bindings), 한국어가 기본 locale이다.
      - name: Check core language tabs and snippets
        run: python3 doc/site/scripts/check_doc_tabs.py core

      - name: Build documentation
        working-directory: doc/site
        run: mkdocs build

      # 옛 core 사이트의 `/ko/**`·`/api/**` 주소를 새 자리로 보낸다.
      - name: Redirect the old paths
        run: python3 doc/site/scripts/make_core_redirects.py doc/site/site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
