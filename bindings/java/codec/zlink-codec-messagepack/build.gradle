plugins {
    id 'java-library'
    id 'maven-publish'
}

group = rootProject.group
version = rootProject.version
description = 'zlink Java MessagePack codec extension'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':')
    compileOnly 'io.netty:netty-buffer:4.1.100.Final'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'org.msgpack:jackson-dataformat-msgpack:0.9.8'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'zlink-codec-messagepack'
            version = project.version
        }
    }
    repositories {
        maven {
            name = 'releaseRepo'
            def repoUrl = System.getenv('MAVEN_REPOSITORY_URL')
            if (repoUrl == null || repoUrl.trim().isEmpty()) {
                def ghRepo = System.getenv('GITHUB_REPOSITORY')
                if (ghRepo != null && !ghRepo.trim().isEmpty()) {
                    repoUrl = "https://maven.pkg.github.com/${ghRepo}"
                } else {
                    repoUrl = "${buildDir}/repo"
                }
            }
            url = uri(repoUrl)
            credentials {
                def u = System.getenv('MAVEN_REPOSITORY_USERNAME')
                def p = System.getenv('MAVEN_REPOSITORY_PASSWORD')
                if ((u == null || u.trim().isEmpty())
                    && (p == null || p.trim().isEmpty())) {
                    u = System.getenv('GITHUB_ACTOR')
                    p = System.getenv('GITHUB_TOKEN')
                }
                username = u
                password = p
            }
        }
    }
}
