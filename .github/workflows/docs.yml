name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'doc/site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r doc/site/requirements.txt

      - name: Check language tabs and snippets
        run: python3 doc/site/scripts/check_doc_tabs.py

      - name: Check framework document contracts
        run: bash scripts/verify-framework-doc-contracts.sh

      - name: Build documentation
        working-directory: doc/site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: doc/site/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
