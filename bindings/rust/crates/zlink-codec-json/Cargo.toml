[package]
name = "zlink-codec-json"
version = "5.3.0"
edition = "2024"
rust-version = "1.85"
description = "JSON codec extension for the zlink Rust bindings"
license = "MPL-2.0"

[dependencies]
serde = "1"
serde_json = "1"
zlink = { path = "../.." }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
