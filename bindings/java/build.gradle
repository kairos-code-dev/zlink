plugins {
    id 'java'
    id 'maven-publish'
}

group = 'systems.zlink'
version = '10.6.0'
description = 'zlink Java bindings — high-performance async messaging library'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

def nativeOs = System.getProperty('os.name').toLowerCase()
def nativeArch = System.getProperty('os.arch').toLowerCase()
def nativeBridgeSupported = nativeOs.contains('linux')
    && ['amd64', 'x86_64'].contains(nativeArch)
def configuredCoreBuildDir = System.getenv('ZLINK_CORE_BUILD_DIR')
def coreBuildDir = configuredCoreBuildDir != null && !configuredCoreBuildDir.trim().isEmpty()
    ? new File(projectDir.parentFile.parentFile, configuredCoreBuildDir)
    : new File(projectDir.parentFile.parentFile, 'core/build')
def generatedNativeResourcesDir = layout.buildDirectory.dir(
    'generated/zlink-native-resources/main')
def bridgeOutputDir = layout.buildDirectory.dir(
    'generated/zlink-native-resources/main/native/linux-x86_64')

sourceSets {
    main {
        resources.srcDir(generatedNativeResourcesDir)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly 'io.netty:netty-buffer:4.1.100.Final'
    runtimeOnly 'io.netty:netty-buffer:4.1.100.Final'
    testImplementation 'io.netty:netty-buffer:4.1.100.Final'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.2'
}

tasks.register('buildZlinkJavaBridge', Exec) {
    onlyIf { nativeBridgeSupported }
    def repoRoot = projectDir.parentFile.parentFile
    def source = new File(projectDir, 'native/src/zlink_java_reqrep_bridge.c')
    def outputDir = bridgeOutputDir.get().asFile
    def output = new File(outputDir, 'libzlink_java_bridge.so')
    def linkDir = new File(coreBuildDir, 'lib')
    def javaHome = System.getProperty('java.home')
    def jniIncludeDir = new File(javaHome, 'include')
    def jniOsIncludeDir = new File(jniIncludeDir, 'linux')
    inputs.file(source)
    inputs.dir(new File(repoRoot, 'core/include'))
    inputs.dir(new File(repoRoot, 'core/src'))
    inputs.dir(new File(repoRoot, 'core/external/boost'))
    inputs.files(fileTree(coreBuildDir) {
        include '*.h'
        include '**/*.h'
        include 'lib/libzlink.so'
        include 'lib/libzlink.so.*'
        include 'libzlink.pc'
        exclude '**/tests/**'
    })
    inputs.dir(linkDir)
    inputs.dir(jniIncludeDir)
    inputs.dir(jniOsIncludeDir)
    outputs.file(output)
    doFirst {
        outputDir.mkdirs()
    }
    commandLine 'c++',
        '-shared',
        '-fPIC',
        '-std=c++17',
        '-O2',
        '-pthread',
        '-I', new File(repoRoot, 'core/include').absolutePath,
        '-I', new File(repoRoot, 'core/src').absolutePath,
        '-I', new File(repoRoot, 'core/external/boost').absolutePath,
        '-I', coreBuildDir.absolutePath,
        '-I', jniIncludeDir.absolutePath,
        '-I', jniOsIncludeDir.absolutePath,
        '-L', linkDir.absolutePath,
        '-Wl,-rpath,$ORIGIN',
        '-Wl,--no-undefined',
        '-o', output.absolutePath,
        source.absolutePath,
        '-Wl,--no-as-needed',
        '-lzlink'
}

processResources {
    dependsOn tasks.named('buildZlinkJavaBridge')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Bundle only a native runtime that was built and verified with this
    // package. Other platform runtimes must not silently retain an older ABI.
    exclude { details ->
        !details.file.isDirectory()
            && details.path.startsWith('native/')
            && !details.path.startsWith('native/linux-x86_64/')
    }
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    def reqrepDebug = System.getProperty('zlink.reqrep.debug')
    if (reqrepDebug != null) {
        systemProperty 'zlink.reqrep.debug', reqrepDebug
    }
    filter {
        excludeTestsMatching 'systems.zlink.integration.*'
    }
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
    def reqrepDebug = System.getProperty('zlink.reqrep.debug')
    if (reqrepDebug != null) {
        systemProperty 'zlink.reqrep.debug', reqrepDebug
    }
    shouldRunAfter test
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    filter {
        includeTestsMatching 'systems.zlink.integration.contract.*'
    }
}

tasks.register('runMessageOutboundMicrobench') {
    group = 'benchmark'
    description = 'Run Java outbound message-path microbenchmarks'
    dependsOn ':perf-single:runMessageOutboundMicrobench'
}

javadoc {
    source = sourceSets.main.allJava.matching {
        exclude 'systems/zlink/internal/**'
        exclude 'systems/zlink/InternalAccess.java'
        exclude 'systems/zlink/runtime/**'
    }
    options.encoding = 'UTF-8'
    options.docTitle = 'zlink Java Binding API'
    options.windowTitle = 'zlink Java Binding'
    options.memberLevel = JavadocMemberLevel.PUBLIC
    options.addStringOption('sourcepath',
        sourceSets.main.java.srcDirs*.absolutePath.join(File.pathSeparator))
    // Suppress missing-@param / missing-@return / no-comment warnings: most public
    // APIs have meaningful class-level Javadoc; per-method param boilerplate adds
    // noise without value. Broken-reference and syntax warnings remain active.
    options.addStringOption('Xdoclint:-missing', '-quiet')
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = 'zlink'
            version = project.version
            pom {
                name = 'zlink'
                description = project.description
                url = 'https://github.com/kairos-code-dev/zlink'
                licenses {
                    license {
                        name = 'MPL-2.0'
                        url = 'https://github.com/kairos-code-dev/zlink/blob/main/LICENSE'
                    }
                }
            }
        }
    }
    repositories {
        maven {
            name = 'releaseRepo'
            def repoUrl = System.getenv('MAVEN_REPOSITORY_URL')
            if (repoUrl == null || repoUrl.trim().isEmpty()) {
                def ghRepo = System.getenv('GITHUB_REPOSITORY')  // owner/repo
                if (ghRepo != null && !ghRepo.trim().isEmpty()) {
                    repoUrl = "https://maven.pkg.github.com/${ghRepo}"
                } else {
                    repoUrl = "${buildDir}/repo"
                }
            }
            url = uri(repoUrl)
            if (!url.scheme.equalsIgnoreCase('file')) {
                credentials {
                    def u = System.getenv('MAVEN_REPOSITORY_USERNAME')
                    def p = System.getenv('MAVEN_REPOSITORY_PASSWORD')
                    if ((u == null || u.trim().isEmpty()) && (p == null || p.trim().isEmpty())) {
                        u = System.getenv('GITHUB_ACTOR')
                        p = System.getenv('GITHUB_TOKEN')
                    }
                    username = u
                    password = p
                }
            }
        }
    }
}
