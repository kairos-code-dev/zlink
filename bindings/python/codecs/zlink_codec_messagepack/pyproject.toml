[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zlink-codec-messagepack"
version = "5.3.4"
description = "MessagePack codec helpers for zlink Python bindings"
license = { text = "MPL-2.0" }
authors = [{ name = "Zlink Systems" }]
requires-python = ">=3.9"
dependencies = [
    "zlink>=5.3.4",
    "msgpack>=1.0",
]

[project.urls]
Homepage = "https://zlink.systems/"
Repository = "https://github.com/ulala-x/zlink"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
zlink = { path = "../../", editable = true }
