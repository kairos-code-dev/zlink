plugins {
    id 'application'
}

repositories {
    maven { url = uri(System.getenv('ZLINK_LOCAL_MAVEN_REPOSITORY')) }
    mavenCentral()
}

dependencies {
    implementation 'systems.zlink:zlink:11.0.2'
}

application {
    mainClass = 'consumer.PublicConsumer'
    applicationDefaultJvmArgs = ['--enable-native-access=ALL-UNNAMED']
}
