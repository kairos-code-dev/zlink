site_name: ZLink Framework
site_url: https://zlink.systems/
site_description: ZLink Framework — 실시간 메시징 서버 프레임워크

repo_url: https://github.com/zlink-systems/zlink
repo_name: zlink-systems/zlink

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.highlight

nav:
  - Home: index.md
  - 스파이크: spike.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      dedent_subsections: true
      # base_path는 mkdocs 실행 cwd(framework/doc/site) 기준.
      # repo 루트를 포함시켜 가이드가 framework/languages/<lang>/samples/의
      # 실제 샘플 파일을 그대로 임베드한다.
      base_path:
        - .
        - ../../..
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 한글 제목이 anchor로 살아남으려면 unicode slug가 필요하다.
      # 기본 slugify는 non-ASCII를 버려서 문서 내 링크가 전부 깨진다.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          unicode: true
