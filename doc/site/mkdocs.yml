site_name: zlink Guide
site_url: https://zlink.systems/
site_description: zlink — Modern messaging library guide
repo_url: https://github.com/kairos-code-dev/zlink
repo_name: kairos-code-dev/zlink

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# 다이어그램 안 글씨를 키운다. 폰트만 올리면 자연폭이 함께 늘어 축소율이 나빠지므로
# 폰트와 간격 상수를 같이 조정한다. 자세한 이유는 hook 파일 머리말에.
hooks:
  - hooks/mermaid_size.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Guide: 가이드
            Overview: 개요
            Core API: 핵심 API
            Socket Patterns: 소켓 패턴
            Transports: 트랜스포트
            TLS Security: TLS 보안
            Monitoring: 모니터링
            Services: 서비스
            Routing ID: 라우팅 ID
            Message API: 메시지 API
            Performance: 성능
            Thread Safety: 스레드 안전성
            Socket Options: 소켓 옵션
            API Reference: API 레퍼런스
            Context: 컨텍스트
            Message: 메시지
            Events: 이벤트
            Polling: 폴링
            Errors: 에러
            Bindings: 바인딩
            Getting Started: 시작하기
            Messaging: 메시징
            Operations: 운영
            Reference: 레퍼런스
            Utilities: 유틸리티
            Internals: 내부 구조
            Architecture: 아키텍처
            Threading Model: 스레딩 모델
            Design Decisions: 설계 결정
            POSD Module Structure: POSD 모듈 구조
            Services Internals: 서비스 내부
            Stream Socket: 스트림 소켓
            Protocol ZMP: ZMP 프로토콜
            Protocol Raw: Raw 프로토콜
            SPOT Internals: SPOT 내부 구조
            I/O Thread: I/O 스레드
            Result Enums: 결과 Enum
            Actor: Actor

