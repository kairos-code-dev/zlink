[package]
name = "zlink-codec-messagepack"
version = "6.0.0"
edition = "2024"
rust-version = "1.85"
description = "MessagePack codec extension for the zlink Rust bindings"
license = "MPL-2.0"
homepage = "https://zlink.systems/"

[dependencies]
rmp-serde = "1"
serde = "1"
zlink = { version = "6.0.0", path = "../.." }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
