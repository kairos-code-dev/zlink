    - I/O Thread: internals/io-thread.md
    - Protocol ZMP: internals/protocol-zmp.md
    - Protocol Raw: internals/protocol-raw.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.snippets:
      dedent_subsections: true
      # base_path는 mkdocs 실행 cwd(doc/site) 기준. repo 루트를 포함시켜
      # 가이드가 bindings/<lang>/samples/의 실제 예제 파일을 그대로 임베드한다.
      base_path:
        - .
        - ../..
  - pymdownx.details
  - pymdownx.mark
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          unicode: true
  - attr_list
  - md_in_html
  - def_list

extra_css:
  - assets/stylesheets/extra.css
  - assets/korean.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kairos-code-dev/zlink
  generator: false
