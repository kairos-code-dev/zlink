[package]
name = "zlink-codec-messagepack"
version = "5.3.2"
edition = "2024"
rust-version = "1.85"
description = "MessagePack codec extension for the zlink Rust bindings"
license = "MPL-2.0"

[dependencies]
rmp-serde = "1"
serde = "1"
zlink = { version = "5.3.2", path = "../.." }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
