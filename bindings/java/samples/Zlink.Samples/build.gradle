plugins {
    id 'application'
}

evaluationDependsOn(':')

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}

dependencies {
    implementation project(':')
    compileOnly 'io.netty:netty-buffer:4.1.100.Final'
}

def sampleMainClasses = [
    runRequestReplyAsync: 'dev.kairoscode.zlink.samples.RequestReplyAsyncSample',
    runPairRecv: 'dev.kairoscode.zlink.samples.PairRecvSample',
    runPubSubRecv: 'dev.kairoscode.zlink.samples.PubSubRecvSample',
    runDealerRouterRecv: 'dev.kairoscode.zlink.samples.DealerRouterRecvSample',
    runStreamRecv: 'dev.kairoscode.zlink.samples.StreamRecvSample',
    runStreamPacketCallback: 'dev.kairoscode.zlink.samples.StreamPacketCallbackSample',
    runMonitorRecv: 'dev.kairoscode.zlink.samples.MonitorRecvSample',
    runSpotRecv: 'dev.kairoscode.zlink.samples.SpotRecvSample',
    runSpotRequestAsync: 'dev.kairoscode.zlink.samples.SpotRequestAsyncSample'
]

sampleMainClasses.each { taskName, mainClassName ->
    tasks.register(taskName, JavaExec) {
        group = 'application'
        classpath =
          sourceSets.main.runtimeClasspath + project(':').sourceSets.main.runtimeClasspath
        mainClass = mainClassName
        jvmArgs '--enable-native-access=ALL-UNNAMED'
    }
}

tasks.register('runAllSamples') {
    group = 'application'
    dependsOn sampleMainClasses.keySet().collect { tasks.named(it) }
}
