site_name: ZLink Framework
site_url: https://zlink.systems/
site_description: ZLink Framework — 실시간 메시징 서버 프레임워크

repo_url: https://github.com/zlink-systems/zlink
repo_name: zlink-systems/zlink

# 정본 문서 트리를 그대로 docs root로 쓴다. 사이트용 사본을 두지 않으므로
# 문서끼리의 상대 링크가 repo에서든 사이트에서든 같은 대상을 가리킨다.
docs_dir: ../framework

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: ko
          name: 한국어
          default: true
          build: true

# 가이드 · 스펙 · 샘플만 사이트에 올린다(런북 §7.1). internals는 구현·검증 기준이고
# e2e는 검증 시나리오라 독자용 문서가 아니다. mkdocs는 nav에 없어도 docs_dir 아래
# 파일을 전부 빌드하므로 여기서 명시적으로 뺀다.
exclude_docs: |
  perf/
  */internals/
  common/e2e/

nav:
  - 홈: index.ko.md
  - 가이드:
      - common/guide/server/03-concepts.ko.md
      - common/guide/server/04-backpressure.ko.md
      - common/guide/server/05-channel-messaging.ko.md
      - common/guide/server/06-spot.ko.md
      - common/guide/server/07-actor-spot.ko.md
      - common/guide/server/08-actor-session.ko.md
      - common/guide/server/09-stream.ko.md
      - common/guide/server/10-location.ko.md
      - common/guide/server/12-operations.ko.md
      - common/guide/server/14-samples.ko.md
      - common/guide/server/15-e2e-testing.ko.md
      - common/guide/server/17-alternative.ko.md
  - 언어별:
      - .NET:
          - dotnet/guide/server/README.ko.md
          - dotnet/guide/server/01-overview.ko.md
          - dotnet/guide/server/02-getting-started.ko.md
          - dotnet/guide/server/11-monitoring.ko.md
          - dotnet/guide/server/13-interface-catalog.ko.md
          - dotnet/guide/server/16-options.ko.md
      - C++:
          - cpp/guide/server/README.ko.md
          - cpp/guide/server/01-overview.ko.md
          - cpp/guide/server/02-getting-started.ko.md
          - cpp/guide/server/21-execution-model.ko.md
          - cpp/guide/server/11-monitoring.ko.md
          - cpp/guide/server/13-interface-catalog.ko.md
          - cpp/guide/server/16-options.ko.md
          - cpp/guide/server/18-di-container.ko.md
          - cpp/guide/server/19-configuration.ko.md
          - cpp/guide/server/20-http-hosting.ko.md
      - Java:
          - java/guide/server/README.ko.md
          - java/guide/server/01-overview.ko.md
          - java/guide/server/02-getting-started.ko.md
          - java/guide/server/11-monitoring.ko.md
          - java/guide/server/13-interface-catalog.ko.md
          - java/guide/server/16-options.ko.md
      - Kotlin:
          - kotlin/guide/server/README.ko.md
          - kotlin/guide/server/01-overview.ko.md
          - kotlin/guide/server/02-getting-started.ko.md
          - kotlin/guide/server/11-monitoring.ko.md
          - kotlin/guide/server/13-interface-catalog.ko.md
      - Node.js:
          - node/guide/server/README.ko.md
          - node/guide/server/01-overview.ko.md
          - node/guide/server/02-getting-started.ko.md
          - node/guide/server/13-interface-catalog.ko.md
  - 스펙:
      - common/README.ko.md
      - common/spec/server/languages/README.ko.md
  - 샘플: common/sample/README.ko.md

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      dedent_subsections: true
      # base_path는 mkdocs 실행 cwd(framework/doc/site) 기준.
      # repo 루트를 포함시켜 가이드가 framework/languages/<lang>/samples/의
      # 실제 샘플 파일을 그대로 임베드한다.
      base_path:
        - .
        - ../../..
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      # 한글 제목이 anchor로 살아남으려면 unicode slug가 필요하다.
      # 기본 slugify는 non-ASCII를 버려서 문서 안의 anchor 링크가 전부 깨진다.
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          unicode: true
