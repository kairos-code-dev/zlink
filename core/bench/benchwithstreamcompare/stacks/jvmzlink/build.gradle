plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation fileTree(
        dir: '../../../../../bindings/java/build/libs',
        include: ['zlink-java-*.jar'])
}

application {
    mainClass = 'dev.kairoscode.stream.JvmZlinkStreamServer'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(22)
    }
}
