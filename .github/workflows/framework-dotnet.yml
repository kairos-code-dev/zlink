name: Framework .NET

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/framework-dotnet.yml"
      - "framework/languages/dotnet/**"
      - "bindings/dotnet/src/Zlink/**"
      - "bindings/dotnet/runtimes/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/framework-dotnet.yml"
      - "framework/languages/dotnet/**"
      - "bindings/dotnet/src/Zlink/**"
      - "bindings/dotnet/runtimes/**"
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  FRAMEWORK_SOLUTION: framework/languages/dotnet/Zlink.Framework.sln
  FRAMEWORK_TESTS: framework/languages/dotnet/tests/Zlink.Framework.Tests/Zlink.Framework.Tests.csproj
  FRAMEWORK_MULTIPROCESS_TESTS: framework/languages/dotnet/tests/Zlink.Framework.MultiProcessTests/Zlink.Framework.MultiProcessTests.csproj

jobs:
  framework-dotnet:
    name: ${{ matrix.target.name }}
    runs-on: ${{ matrix.target.runner }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: win-x64
            runner: windows-latest
            rid: win-x64
          - name: win-arm64
            runner: windows-11-arm
            rid: win-arm64
          - name: linux-x64
            runner: ubuntu-24.04
            rid: linux-x64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            rid: linux-arm64
          - name: osx-x64
            runner: macos-15-intel
            rid: osx-x64
          - name: osx-arm64
            runner: macos-15
            rid: osx-arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore framework solution
        run: dotnet restore ${{ env.FRAMEWORK_SOLUTION }}

      - name: Build framework solution (Debug)
        run: dotnet build ${{ env.FRAMEWORK_SOLUTION }} -c Debug --no-restore

      - name: Build framework solution (Release)
        run: dotnet build ${{ env.FRAMEWORK_SOLUTION }} -c Release --no-restore

      - name: Run unit and single-process tests (Debug, net8.0)
        run: dotnet test ${{ env.FRAMEWORK_TESTS }} -c Debug -f net8.0 --no-build

      - name: Run unit and single-process tests (Release, net10.0)
        run: dotnet test ${{ env.FRAMEWORK_TESTS }} -c Release -f net10.0 --no-build

      - name: Run multi-process tests (Release, net8.0)
        run: dotnet test ${{ env.FRAMEWORK_MULTIPROCESS_TESTS }} -c Release -f net8.0 --no-build

      - name: Run multi-process tests (Release, net10.0)
        run: dotnet test ${{ env.FRAMEWORK_MULTIPROCESS_TESTS }} -c Release -f net10.0 --no-build
