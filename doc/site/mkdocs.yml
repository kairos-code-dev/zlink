site_name: zlink Guide
# core는 `/core/` 구역에 실린다. 최상위는 framework 사이트다
# (framework/doc/plan/language-guide-port-runbook.ko.md §7.3).
site_url: https://kairos-code-dev.github.io/zlink/core/
site_description: zlink — Modern messaging library guide
repo_url: https://github.com/kairos-code-dev/zlink
repo_name: kairos-code-dev/zlink

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# 다이어그램 안 글씨를 키운다. 폰트만 올리면 자연폭이 함께 늘어 축소율이 나빠지므로
# 폰트와 간격 상수를 같이 조정한다. 자세한 이유는 hook 파일 머리말에.
hooks:
  - hooks/mermaid_size.py

plugins:
  - search
  - i18n:
      docs_structure: suffix
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ko
          name: 한국어
          build: true
          nav_translations:
            Guide: 가이드
            Overview: 개요
            Core API: 핵심 API
            Socket Patterns: 소켓 패턴
            Transports: 트랜스포트
            TLS Security: TLS 보안
            Monitoring: 모니터링
            Services: 서비스
            Routing ID: 라우팅 ID
            Message API: 메시지 API
            Performance: 성능
            Thread Safety: 스레드 안전성
            Socket Options: 소켓 옵션
            API Reference: API 레퍼런스
            Context: 컨텍스트
            Message: 메시지
            Events: 이벤트
            Polling: 폴링
            Errors: 에러
            Bindings: 바인딩
            Getting Started: 시작하기
            Messaging: 메시징
            Operations: 운영
            Reference: 레퍼런스
            Utilities: 유틸리티
            Internals: 내부 구조
            Architecture: 아키텍처
            Threading Model: 스레딩 모델
            Design Decisions: 설계 결정
            POSD Module Structure: POSD 모듈 구조
            Services Internals: 서비스 내부
            Stream Socket: 스트림 소켓
            Protocol ZMP: ZMP 프로토콜
            Protocol Raw: Raw 프로토콜
            SPOT Internals: SPOT 내부 구조
            I/O Thread: I/O 스레드
            Result Enums: 결과 Enum
            Actor: Actor

# 문서 트리는 정본을 심링크로 직접 건다(`docs/guide` → `core/doc/guide` 등).
# 복사본을 두면 양쪽이 갈라진다 — 실제로 갈라져서 사이트가 byte HWM 이전의 낡은
# 내용을 내고 있었고, v11이 지운 서비스 계층 장까지 남아 있었다.
exclude_docs: |
  # 문서 작성 규약이다. 독자용이 아니다.
  guide/EXAMPLES.ko.md
  guide/STYLE.ko.md
  # 확정 전 초안.
  spec/draft/
  bindings/spec/draft/

nav:
  - Home: index.md
  - Guide:
    - Overview: guide/01-overview.md
    - Concepts:
      - Socket Pattern Selection: guide/03-0-socket-patterns.md
      - Reliability & Delivery: guide/reliability.ko.md
      - Design Rationale: guide/design-rationale.ko.md
      - Message API & Ownership: guide/09-message-api.md
      - Thread Safety: guide/11-thread-safety.md
    - Messaging Patterns:
      - Routing ID: guide/08-routing-id.md
      - PAIR: guide/03-1-pair.md
      - PUB/SUB: guide/03-2-pubsub.md
      - DEALER: guide/03-3-dealer.md
      - ROUTER: guide/03-4-router.md
      - STREAM: guide/03-5-stream.md
      - Proxy: guide/03-6-proxy.md
    - Transports: guide/04-transports.md
    - TLS Security: guide/05-tls-security.md
    - Operations:
      - Monitoring: guide/06-monitoring.md
      - Performance: guide/10-performance.md
    - Reference:
      - Core C API: guide/02-core-api.md
      - Socket Options: guide/12-socket-options.md
      - ZMP Protocol: guide/zmp-protocol.ko.md
      - Glossary: guide/glossary.ko.md
      - Shared Scenarios: guide/scenarios.ko.md
  - Bindings:
    - Overview: bindings/guide/README.ko.md
    - .NET: bindings/guide/dotnet/index.ko.md
    - C++: bindings/guide/cpp/index.ko.md
    - Java: bindings/guide/java/index.ko.md
    - Node.js: bindings/guide/node/index.ko.md
    - Python: bindings/guide/python/index.ko.md
    - Go: bindings/guide/go/index.ko.md
    - Rust: bindings/guide/rust/index.ko.md
  - Binding Spec:
    - Overview: bindings/spec/README.md
    - Async & Coroutine Policy: bindings/spec/async-coroutine-policy.ko.md
    - C: bindings/spec/c/README.md
    - .NET: bindings/spec/dotnet/README.md
    - C++: bindings/spec/cpp/README.md
    - Java: bindings/spec/java/README.md
    - Node.js: bindings/spec/node/README.md
    - Python: bindings/spec/python/README.md
    - Go: bindings/spec/go/README.md
    - Rust: bindings/spec/rust/README.md
  - API Reference:
    - Overview: spec/core/README.md
    - Public Contract Governance: spec/core/00-public-contract-governance.md
    - Context: spec/core/01-context.md
    - Message: spec/core/02-message.md
    - Errors: spec/core/03-errors.md
    - Result Enums: spec/core/04-errno-map.md
    - Events: spec/core/05-events.md
    - Polling: spec/core/06-polling.md
    - Monitoring: spec/core/07-monitoring.md
    - Utilities: spec/core/08-utilities.md
    - Runtime Boundary: spec/core/09-runtime-boundary.md
    - Sockets:
      - Overview: spec/core/socket/README.md
      - PAIR: spec/core/socket/01-pair.md
      - PUB: spec/core/socket/02-pub.md
      - SUB: spec/core/socket/03-sub.md
      - XPUB: spec/core/socket/04-xpub.md
      - XSUB: spec/core/socket/05-xsub.md
      - DEALER: spec/core/socket/06-dealer.md
      - ROUTER: spec/core/socket/07-router.md
      - STREAM: spec/core/socket/08-stream.md
  - Internals:
    - Architecture: internals/architecture.md
    - Threading Model: internals/threading-model.md
    - Thread Safety: internals/thread-safety.md
    - I/O Thread: internals/io-thread.md
    - Design Decisions: internals/design-decisions.md
    - POSD Module Structure: internals/posd-module-structure.md
    - Source Layout: internals/core-source-layout.ko.md
    - Stream Socket: internals/stream-socket.md
    - Socket Options: internals/socket-option-defaults.md
    - Connection Memory: internals/connection-memory.md
    - Multipart Atomicity: internals/multipart-atomicity.ko.md
    - Runtime Boundary: internals/runtime-boundary.md
    - Protocol ZMP: internals/protocol-zmp.md
    - Protocol Raw: internals/protocol-raw.md

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.snippets:
      dedent_subsections: true
      # base_path는 mkdocs 실행 cwd(doc/site) 기준. repo 루트를 포함시켜
      # 가이드가 bindings/<lang>/samples/의 실제 예제 파일을 그대로 임베드한다.
      base_path:
        - .
        - ../..
  - pymdownx.details
  - pymdownx.mark
  - admonition
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
          unicode: true
  - attr_list
  - md_in_html
  - def_list

extra_css:
  - assets/stylesheets/extra.css
  - assets/korean.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/kairos-code-dev/zlink
  generator: false
